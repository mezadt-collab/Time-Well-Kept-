name: Update Gallery Manifest

on:
  push:
    paths:
      - "images/watches/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery-manifest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery manifest
        run: |
          python scripts/generate-gallery-manifest.py

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive/gallery-manifest.json

          if git diff --cached --quiet; then
            echo "Gallery manifest is already up to date."
          else
            git commit -m "Update gallery manifest"
            git push
          fi
